name: Personal iOS check

# Validation only: no publishing, signing, or release uploads.
on:
  workflow_dispatch:
  push:
    branches: ['personal/minimal-ios']

concurrency:
  group: personal-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  personal-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Resolve agentcore test dependencies
        working-directory: packages/agentcore
        run: dart pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test test/personal/personal_edition_test.dart
      - run: flutter build ios --simulator --debug --dart-define=BEECOUNT_PERSONAL=true
